[package]
name = "perihelion"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.30", features = ["default"] }
egui = "0.30"
anyhow = "1.0"
arboard = "3.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
dirs = "6"
rosc = "0.11"
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }
cpal = "0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]

opt-level = 3
lto = "fat"
codegen-units = 1

panic = "abort"
strip = "symbols"
incremental = false

[package]
name = "perihelion"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.30", default-features = false, features = [
    "glow",
    "x11",
    "wayland",
    "accesskit"
] }
egui = { version = "0.30", default-features = false, features = ["color-hex"] }
arboard = "3.4"
dirs = "6"
rosc = "0.11"
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }
cpal = "0.17"
woff2-patched = "0.4.0"
mimalloc = "0.1.50"
parking_lot = "0.12"
minreq = { version = "2.13.2", features = ["https"] }
nanoserde = "0.2.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
overflow-checks = false
